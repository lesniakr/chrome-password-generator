<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Password Generator</h1>

      <div class="password-display">
        <div class="password-input-wrapper">
          <input
            type="text"
            id="password-output"
            class="password-output"
            readonly
            title="Click to copy"
          />
          <svg
            class="copy-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path
              d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
            ></path>
          </svg>
        </div>
        <button id="regenerate-btn" class="btn-icon" title="Generate new password">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          </svg>
        </button>
      </div>

      <div class="strength-container">
        <div class="strength-bar">
          <div id="strength-fill" class="strength-fill"></div>
        </div>
        <span id="strength-label" class="strength-label">None</span>
      </div>

      <div class="options">
        <div class="option-row">
          <label for="length">Length</label>
          <div class="length-control">
            <input type="range" id="length" min="8" max="64" value="16" />
            <span id="length-value" class="length-value">16</span>
          </div>
        </div>

        <div class="option-row">
          <label for="lowercase">Lowercase (a-z)</label>
          <input type="checkbox" id="lowercase" checked />
        </div>

        <div class="option-row">
          <label for="uppercase">Uppercase (A-Z)</label>
          <input type="checkbox" id="uppercase" checked />
        </div>

        <div class="option-row">
          <label for="digits">Digits (0-9)</label>
          <input type="checkbox" id="digits" checked />
        </div>

        <div class="option-row">
          <label for="symbols">Symbols (!@#$...)</label>
          <input type="checkbox" id="symbols" />
        </div>
      </div>

      <div id="message" class="message"></div>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
